<svg class="robot" viewBox="0 0 200 230" role="img" aria-label="Friendly robot assistant">
  <ellipse class="r-shadow" cx="100" cy="219" rx="46" ry="7"/>
  <g class="r-float">
    <!-- antenna -->
    <line class="r-stroke" x1="100" y1="42" x2="100" y2="22" stroke-width="5" stroke-linecap="round"/>
    <circle class="r-antenna" cx="100" cy="15" r="7"/>

    <!-- arms (right one waves) -->
    <rect class="r-fill arm-l" x="34" y="142" width="18" height="46" rx="9"/>
    <g class="arm-r"><rect class="r-fill" x="148" y="142" width="18" height="46" rx="9"/></g>

    <!-- body + feet -->
    <rect class="r-fill" x="56" y="130" width="88" height="68" rx="24"/>
    <circle class="r-chest" cx="100" cy="165" r="10"/>
    <rect class="r-fill" x="68" y="194" width="26" height="14" rx="7"/>
    <rect class="r-fill" x="106" y="194" width="26" height="14" rx="7"/>

    <!-- head -->
    <rect class="r-fill" x="26" y="68" width="14" height="30" rx="7"/>
    <rect class="r-fill" x="160" y="68" width="14" height="30" rx="7"/>
    <rect class="r-fill" x="38" y="42" width="124" height="94" rx="30"/>
    <rect class="r-screen" x="52" y="56" width="96" height="66" rx="22"/>

    <!-- face -->
    <g class="eyes-track">
      <g class="eyes">
        <ellipse class="r-eye" cx="80" cy="86" rx="9" ry="12"/>
        <ellipse class="r-eye" cx="120" cy="86" rx="9" ry="12"/>
      </g>
    </g>
    <circle class="r-cheek" cx="66" cy="104" r="5"/>
    <circle class="r-cheek" cx="134" cy="104" r="5"/>
    <path class="r-mouth" d="M 88 106 Q 100 115 112 106" fill="none" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
