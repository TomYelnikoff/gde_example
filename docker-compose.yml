# On EC2: credentials come from the instance's IAM role - nothing to configure.
#   docker compose up -d --build
#
# Local testing with your own AWS credentials (never baked into the image):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  chatbot:
    build: .
    image: bedrock-chatbot:latest
    ports:
      - "80:8000"
    environment:
      AWS_REGION: us-east-1
      # BEDROCK_MODEL_ID: global.anthropic.claude-opus-4-6-v1
    volumes:
      - chat-data:/data
    restart: unless-stopped

volumes:
  chat-data:
